name: Build Release APK

on:
  workflow_dispatch:
    inputs:
      build_name:
        description: 'Android version name (blank uses pubspec.yaml)'
        type: string
        required: false
      build_number:
        description: 'Android version code (blank uses pubspec.yaml)'
        type: string
        required: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.7'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Validate app
        run: |
          flutter analyze --no-pub
          flutter test --no-pub

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/notevision-release.jks
          chmod 600 android/app/notevision-release.jks
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=%s\n' \
            "$KEYSTORE_PASSWORD" \
            "$KEY_PASSWORD" \
            "$KEY_ALIAS" \
            "notevision-release.jks" > android/key.properties
          chmod 600 android/key.properties

      - name: Build release APK
        env:
          BUILD_NAME: ${{ inputs.build_name }}
          BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          args=(--release --no-pub)
          if [[ -n "$BUILD_NAME" ]]; then args+=(--build-name "$BUILD_NAME"); fi
          if [[ -n "$BUILD_NUMBER" ]]; then args+=(--build-number "$BUILD_NUMBER"); fi
          flutter build apk "${args[@]}"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: note-vision-release-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
