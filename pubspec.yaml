name: note_vision
description: "Capstone: Optical Music Recognition Mobile App."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  # Camera / image input
  camera: ^0.12.0
  image_picker: ^1.1.2
  file_picker: ^8.1.2

  # Image processing (pure Dart)
  image: ^4.8.0

  # ML inference
  tflite_flutter: ^0.12.1

  # MusicXML parsing + export
  xml: ^6.5.0

  # PDF export
  pdf: ^3.11.1

  # Audio playback
  flutter_midi_pro: ^3.1.6

  # State management
  provider: ^6.1.5+1

  # Storage & paths
  shared_preferences: ^2.0.15
  path_provider: ^2.1.5
  path: ^1.9.0

  # File sharing
  share_plus: ^12.0.2
  archive: ^4.0.7

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mockito: ^5.4.4
  mocktail: ^1.0.4
  build_runner: ^2.4.8
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/fonts/
    - assets/models/best_int8.tflite
    - assets/soundfonts/
    - assets/samples/

  fonts:
    - family: MaturaMTScriptCapitals
      fonts:
        - asset: assets/fonts/maturasc.ttf

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"
  remove_alpha_ios: true
  min_sdk_android: 26
  adaptive_icon_background: "#0D0D0D"
  adaptive_icon_foreground: "assets/images/app_icon.png"
